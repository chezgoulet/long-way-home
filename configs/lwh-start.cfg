// Long Way Home -- the one place a run's launch values live (gate G1, docs/the-entry-point.md).
//
// Two things execute this file and nothing else restates its values:
//   * scripts/run-lwh.sh, the launcher, with `+exec lwh-start.cfg`
//   * the "Long Way Home" line on the main menu, module/ui/ui_lwh_start.cpp, with `exec`
// Change a value here and both entry paths change with it; there is no second copy to drift.
//
// g_ship is off by default in the code (`g_ship 0`), so the retail campaign and Holomatch behave
// exactly as they always did. This file turns the simulation on for a Long Way Home session only.
set g_ship 1

// g_shipDeckPitch is the merged ship's deck pitch in world units, and it is not folklore: it is
// tools/shipmap/stitch.py's `--pitch` default, 3072 = 3 * 1024. The stitcher places deck n at
// (n - 1) * pitch below deck 1, and the pitch must be a multiple of 1024 or world-aligned textures
// slip. The deck-scoped name lookup (module/ship/g_scope.cpp) and the crew layer
// (module/crew/g_crew.cpp) both divide a world z by this number to know which deck they are on. The
// shipped map was built with the default, so this is the value that matches it.
set g_shipDeckPitch 3072

// The merged ship is one single-player map. `map`, not `spmap`: AGENTS.md records that `map` is the
// SP route and `spmap` the Holomatch route, and using the wrong one boots the wrong mode.
map voyager
